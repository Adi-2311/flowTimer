<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Question Randomizer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        .card {
            background: #fff;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }
        h1, h2 {
            margin-top: 0;
            color: #2c3e50;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }
        .input-group input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .btn-success {
            background-color: #2ecc71;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        #entry-list {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }
        #active-question-area {
            text-align: center;
            display: none;
        }
        #current-question-display {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 1.5rem 0;
            padding: 1.5rem;
            background-color: #e8f4f8;
            border-radius: 8px;
            border: 2px solid #3498db;
        }
        .status {
            text-align: center;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Math Randomizer</h1>
        <p>Add the chapters you want to practice. The app will generate a pool of questions and draw them randomly.</p>
        
        <div class="input-group">
            <input type="number" id="unit" placeholder="Unit #" min="1">
            <input type="number" id="chapter" placeholder="Chapter #" min="1">
            <input type="number" id="numQuestions" placeholder="Total Questions" min="1">
        </div>
        <button onclick="addEntry()">Add Entry</button>

        <div id="entry-list"></div>
        <p>Total questions in pool: <span id="pool-count">0</span></p>

        <button id="start-btn" onclick="startRandomizer()" disabled>Start Practice</button>
    </div>

    <div class="card" id="active-question-area">
        <h2>Current Question</h2>
        <div id="current-question-display">Waiting to start...</div>
        <button id="done-btn" class="btn-success" onclick="markDone()">Done! Next Question</button>
    </div>

    <script>
        // Array to hold every single individual question
        let questionPool = [];

        function addEntry() {
            const unit = document.getElementById('unit').value;
            const chapter = document.getElementById('chapter').value;
            const numQuestions = parseInt(document.getElementById('numQuestions').value);

            if (!unit || !chapter || isNaN(numQuestions) || numQuestions < 1) {
                alert("Please fill out all fields with valid numbers.");
                return;
            }

            // Generate individual questions and add to the pool
            for (let i = 1; i <= numQuestions; i++) {
                questionPool.push({
                    unit: unit,
                    chapter: chapter,
                    questionNumber: i
                });
            }

            // Update UI
            const entryList = document.getElementById('entry-list');
            entryList.innerHTML += `Added Unit ${unit}, Chapter ${chapter} (${numQuestions} questions)<br>`;
            
            updatePoolCount();

            // Clear inputs for the next entry
            document.getElementById('unit').value = '';
            document.getElementById('chapter').value = '';
            document.getElementById('numQuestions').value = '';

            // Enable start button
            document.getElementById('start-btn').disabled = false;
        }

        function updatePoolCount() {
            document.getElementById('pool-count').innerText = questionPool.length;
        }

        function startRandomizer() {
            if (questionPool.length === 0) return;

            // Hide the setup button, show the active area
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('active-question-area').style.display = 'block';
            
            drawNextQuestion();
        }

        function drawNextQuestion() {
            if (questionPool.length === 0) {
                document.getElementById('current-question-display').innerText = "🎉 All questions completed! Great job!";
                document.getElementById('current-question-display').style.borderColor = "#2ecc71";
                document.getElementById('current-question-display').style.backgroundColor = "#eafaf1";
                document.getElementById('done-btn').style.display = 'none';
                return;
            }

            // Pick a random index
            const randomIndex = Math.floor(Math.random() * questionPool.length);
            
            // Extract the question from the pool (removes it so it isn't asked again)
            const selectedQuestion = questionPool.splice(randomIndex, 1)[0];
            
            // Display it
            document.getElementById('current-question-display').innerText = 
                `Unit ${selectedQuestion.unit} | Chapter ${selectedQuestion.chapter} | Question #${selectedQuestion.questionNumber}`;
            
            updatePoolCount();
        }

        function markDone() {
            drawNextQuestion();
        }
    </script>
</body>
</html>
